<!DOCTYPE html>
<html lang="en">
<head>
    <title>Overloading</title>
    <script>
        function Sum(a,b)
        {
            console.log(a+b);
        }
        Sum();
        Sum(1,2);
        Sum(1.2,3.6);
        Sum("JSp",6);  
    </script>
</head>
<body>
    <h1>JS Overloading</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Function Expression</title>
    <script>
        // Function Expression
        let greetMsg = function()
         {
            console.log("Hello, this is a function expression!");
        }
        greetMsg();

        console.log("-----------------------------------");
        
         let Msg = function()
        {
            console.log("Hello World!");
        }
         Msg();
    </script>
</head>
<body>
    <h1>Function Expression</h1>
</body>
</html>

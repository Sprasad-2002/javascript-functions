<!DOCTYPE html>
<html lang="en">
<head>
    <title> Variable Arguments</title>
    <script>
        function Sum()
        {
            let sum=0;
            for (let i=0;i<arguments.length;i++)
        {
            sum=sum+arguments[i];
        }
        console.log("Sum="+ sum);
        }
      Sum();
      Sum(1,2);
      Sum(12,10,22);
      Sum(1,2,3,4,);
    </script>
</head>
<body>
    <h1>JS Variable Arguments</h1>
</body>
</html>

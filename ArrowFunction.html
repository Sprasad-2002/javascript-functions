<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arrow Function</title>
    <script>
        // Arrow Function
        let wishMsg = () => {
            console.log("Hello, this is an arrow function !");
        }
        wishMsg();
    </script>
</head>
<body>
    <h1>Arrow Function</h1>
</body>
</html>
